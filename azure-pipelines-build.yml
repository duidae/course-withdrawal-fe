# Node.js with React
# Build a Node.js project that uses React.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger: 
  - none

resources:
  repositories:
    - repository: templates
      type: git
      name: COOL-LTI/azure-pipeline-templates
      ref: refs/tags/v1.2.1

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: '22.22.2'
  npmVersion: '10.9.7'
  backendNpmrcPath: './backend/.npmrc'
  frontendNpmrcPath: './frontend/.npmrc'

stages:
- stage: SonarQube
  displayName: SonarQube stage
  jobs:
  - template: sonarqube-job.yml@templates
    parameters:
      projectKey: ntu-cool:course-withdrawal
      projectVersion: "dev"

- template: web-app-build-stage.yml@templates
  parameters:
    nodejsVersion: ${{ variables.nodeVersion }}
    npmVersion: ${{ variables.npmVersion }}
    npmrcPaths:
    - ${{ variables.backendNpmrcPath }}
    - ${{ variables.frontendNpmrcPath }}
    buildDirectories:
    - ./frontend
    - ./backend

- template: web-app-test-stage.yml@templates
  parameters:
    nodejsVersion: ${{ variables.nodeVersion }}
    npmVersion: ${{ variables.npmVersion }}
    npmrcPaths:
    - ${{ variables.backendNpmrcPath }}  # only backend need to be tested here
    testDirectories:
    - ./backend
